cases:
  - id: numeric-vat-total
    input: "What is 128.50 plus 20% VAT?"
    expected: 154.20
    actual: "The total including VAT is 154.2"
    tags: [numeric]
    evaluators:
      - type: numeric_tolerance
        config:
          tolerance: 0.01
          mode: absolute

  - id: numeric-relative-estimate
    input: "Roughly how many seconds in a fortnight?"
    expected: 1209600
    actual: "About 1,200,000 seconds."
    tags: [numeric, estimate]
    evaluators:
      - type: numeric_tolerance
        config:
          tolerance: 0.01
          mode: relative

  - id: numeric-currency-formatted
    input: "What is the outstanding balance?"
    expected: 1042.75
    actual: "Your outstanding balance is £1,042.75."
    tags: [numeric, currency]
    evaluators:
      - type: numeric_tolerance
        config:
          tolerance: 0.0
      - type: regex
        config:
          pattern: "£[0-9,]+\\.[0-9]{2}"
