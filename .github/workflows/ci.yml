name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit tests
        run: pytest -q --cov=evalharness --cov-report=term-missing

      - name: Validate bundled suites
        run: evalharness validate examples/

      - name: Run bundled suites
        run: evalharness run examples/ --fail-under 0.9 --format junit --output reports/junit.xml

      - name: Assert the gate actually fails on a regression
        run: |
          set +e
          evalharness run tests/fixtures/regressed.yaml
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 from a regressed suite, got $code"
            exit 1
          fi
          echo "regression correctly reported exit code 1"

      - name: Assert a broken suite is distinguishable from a regression
        run: |
          set +e
          evalharness run tests/fixtures/broken.yaml
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "expected exit code 3 from a malformed suite, got $code"
            exit 1
          fi
          echo "malformed suite correctly reported exit code 3"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore
