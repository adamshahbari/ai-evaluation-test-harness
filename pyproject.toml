[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalharness"
version = "0.1.0"
description = "Deterministic regression testing for language-model outputs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Adam Shahbari" }]
keywords = ["testing", "regression", "evaluation", "llm", "quality-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
evalharness = "evalharness.cli:main"

[project.urls]
Source = "https://github.com/adamshahbari/ai-evaluation-test-harness"

[tool.hatch.build.targets.wheel]
packages = ["src/evalharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
